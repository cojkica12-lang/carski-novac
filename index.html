<style>
:root{--bg:#eceee8;--sf:#fbfbf7;--tx:#1c2825;--mu:#5d6b66;--ac:#2d7a6a;--br:#9a6a2a;--ln:#d3d8d0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c1a;--sf:#1e2927;--tx:#e6ede8;--mu:#93a49d;--ac:#6cc2ae;--br:#d1a05f;--ln:#2e3d39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141c1a;--sf:#1e2927;--tx:#e6ede8;--mu:#93a49d;--ac:#6cc2ae;--br:#d1a05f;--ln:#2e3d39;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 28px/1.15 "Iowan Old Style",Palatino,Georgia,serif;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--mu);margin:0 0 18px;font-size:15px}
.mine{display:flex;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:16px}
.mine .th{width:72px;height:72px;border-radius:50%;border:3px solid var(--br);background:var(--bg);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center}
.mine img{width:100%;height:100%;object-fit:cover}
.mine p{margin:0;font-size:14px;color:var(--mu)}.mine b{color:var(--tx);display:block;font-size:16px}
.btn{display:inline-block;margin-top:6px;padding:7px 12px;border-radius:8px;background:var(--ac);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer;border:0;text-decoration:none}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=file]{display:none}
input[type=search]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;margin-bottom:10px}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.f button{padding:7px 13px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.f button.on{background:var(--br);border-color:var(--br);color:var(--bg);font-weight:600}
.cnt{color:var(--mu);font-size:13px;margin:10px 0}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;overflow:hidden}
.h{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--br);flex:none;overflow:hidden;display:grid;place-items:center;font:600 20px Georgia,serif;color:var(--br)}
.av img{width:100%;height:100%;object-fit:cover}
.hd{flex:1;min-width:0}.hd b{display:block;font:600 18px/1.2 "Iowan Old Style",Palatino,Georgia,serif}.hd i{font-size:13px;color:var(--mu);font-style:normal}
.bd{font-size:12px;color:var(--ac);text-align:right;max-width:84px}
.d{padding:0 14px 14px;border-top:1px solid var(--ln)}
.d p{margin:10px 0 0;font-size:15px}.d .lg{font:600 14px "Iowan Old Style",Georgia,serif;color:var(--br);letter-spacing:.04em}
.st{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.st figure{margin:0;flex:none;width:130px;position:relative}
.st img{width:130px;height:130px;object-fit:cover;border-radius:50%;border:2px solid var(--ln);display:block}
.st figure.m img{border-color:var(--ac)}
.st figcaption{text-align:center;font-size:12px;color:var(--mu);margin-top:4px}
.x{position:absolute;top:0;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--tx);color:var(--bg);cursor:pointer;font-size:15px;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pl img{width:130px;height:180px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--ln);cursor:zoom-in}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;overflow:auto;padding:12px;justify-content:flex-start;align-items:flex-start;z-index:20}
#zm img{width:min(170vw,1100px);max-width:none;background:#fff}
.ty{margin:6px 0;padding-left:18px;font-size:13px;line-height:1.45}.ty li{margin-bottom:3px}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90%}
button:focus-visible,.btn:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.cr{margin-top:22px;font-size:13px;color:var(--mu)}.cr summary{cursor:pointer;font-weight:600}.cr p{margin:6px 0}.cr a{color:var(--ac)}

.av img{object-position:left center}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar h2{font:600 24px/1.15 "Iowan Old Style",Palatino,Georgia,serif;margin:0}
.bk{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}
.gal{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.gal figure{margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.gal img{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in}
.gal figcaption{padding:8px 12px;font-size:12px;color:var(--mu)}.gal figcaption a{color:var(--ac)}
#zm img.fit{width:auto;max-width:100%;max-height:100%;object-fit:contain;margin:auto}

function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("net"));document.head.appendChild(s)})}
let MN=null;

function loadImg(src){return new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src})}
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("cn",1);r.onupgradeneeded=()=>r.result.createObjectStore("e");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction("e").objectStore("e").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction("e","readwrite");t.objectStore("e").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}catch(e){}}
function prep(img){const N=224,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d",{willReadFrequently:true});
const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(w,h);
x.drawImage(img,w/h>1.5?0:(w-s)/2,(h-s)/2,s,s,0,0,N,N);
const d=x.getImageData(0,0,N,N),p=d.data,R=N/2,g=new Float32Array(N*N);let sum=0,n=0;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx;g[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];if((xx-R)**2+(y-R)**2<=R*R*.9){sum+=g[i];n++}}
const m=sum/n;let v=0;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){if((xx-R)**2+(y-R)**2<=R*R*.9){v+=(g[y*N+xx]-m)**2}}
const sd=Math.sqrt(v/n)||1;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx,o=((xx-R)**2+(y-R)**2<=R*R*.9)?Math.max(0,Math.min(255,128+(g[i]-m)/sd*45)):128;p[i*4]=p[i*4+1]=p[i*4+2]=o;p[i*4+3]=255}
x.putImageData(d,0,0);return c}
async function embed(m,img){const t=m.infer(prep(img),true);const v=Float32Array.from(await t.data());t.dispose();let n=0;for(let i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;for(let i=0;i<v.length;i++)v[i]/=n;return v}
function refList(){const r=[];Object.keys(EN).forEach(n=>{
if(typeof CHART!=="undefined"&&CHART[n])r.push({n,m:"",s:CHART[n]});

const b=(typeof BAZA!=="undefined"&&BAZA[n])||{};
Object.keys(b).forEach(m=>b[m].forEach(x=>r.push({n,m,s:"baza/"+n.replace(/ /g,"_")+"/"+m+"/"+x.f})))});return r}

S.db=db;
setBusy("Poredim tvoj novčić…");
const qi=await loadImg(S.mine);if(!qi)throw new Error("img");
S.qv=await embed(m,qi);score();
}catch(e){toast("Prepoznavanje nije uspelo. Proveri internet i pokušaj ponovo.")}
S.busy=null;working=false;$("res").innerHTML=resHTML()}
function score(){const best={};
for(const r of S.db.d){if(S.nomf&&r.m!==S.nomf)continue;let d=0;for(let i=0;i<S.qv.length;i++)d+=S.qv[i]*r.v[i];if(!(r.n in best)||d>best[r.n])best[r.n]=d}
S.res=Object.keys(best).map(n=>({n,s:best[n]})).sort((a,b)=>b.s-a.s).slice(0,3)}
function rescore(){if(S.qv&&S.db){score();$("res").innerHTML=resHTML()}}
function thumbUrl(e){const ph=S.ph[e.id]||[];if(ph[0])return ph[0];if(typeof CHART!=="undefined"&&CHART[e[1]])return CHART[e[1]];
if(typeof IMG!=="undefined"&&IMG[e[1]]&&IMG[e[1]][0])return IMG[e[1]][0][0];
const n=noms(e);return n.length?bp(e,n[0][0],n[0][1][0].f):""}
function resHTML(){
if(S.busy)return `<div class="mine"><p>${S.busy}</p></div>`;
if(!S.mine)return "";
if(!S.qv)return `<div class="mine"><div><b>Prepoznavanje cara</b><button class="btn" data-a="idf">Prepoznaj cara</button></div></div>`;
const av=e=>{const u=thumbUrl(e);return u?`<img src="${u}" alt="">`:e[0][0]};
const chips=`<p>Nominacija mog novčića:</p><div class="f">`+[["","Ne znam"]].concat(NORD.map(n=>[n,NOMN[n]])).map(([n,l])=>`<button data-a="nf" data-n="${n}" class="${S.nomf===n?"on":""}">${l}</button>`).join("")+`</div>`;
const list=S.res&&S.res.length?S.res.map(r=>{const e=EN[r.n];return `<article class="c" style="margin:8px 0 0"><button class="h" data-a="go" data-i="${e.id}"><span class="av">${av(e)}</span><span class="hd"><b>${e[0]}</b><i>${e[1]}, ${e[2]}</i></span><span class="bd">${Math.round(r.s*100)}%</span></button></article>`}).join(""):`<p>Nema slika te nominacije u bazi.</p>`;
return `<div class="mine" style="display:block"><b>Najsličniji carevi (okvirno)</b><p>Procena po izgledu slike. Nije sigurno, proveri sam.</p>${list}${chips}<button class="btn g" data-a="idf">Pokušaj ponovo</button></div>`}
/* ===== Ekrani: car i nominacija ===== */
const NOMN={aureus:"Aureus",antoninijan:"Antoninijan",denarij:"Denarijus",sestercij:"Sestercijus",dupondije:"Dupondijus",as:"As",follis:"Follis",solidus:"Solidus",siliqua:"Siliqua",centenionalis:"Centenionalis",argenteus:"Argenteus"};
const NORD=Object.keys(NOMN);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bp=(e,nom,f)=>"baza/"+e[1].replace(/ /g,"_")+"/"+nom+"/"+f;
function noms(e){const b=(typeof BAZA!=="undefined"&&BAZA[e[1]])||{};return NORD.filter(n=>b[n]&&b[n].length).map(n=>[n,b[n]])}
function nav(v,car,nom){S.v=v;S.car=car;S.nom=nom||null;history.pushState({v:v,car:car,nom:S.nom},"");render();window.scrollTo(0,0)}
window.addEventListener("popstate",ev=>{const st=ev.state||{v:0};S.v=st.v||0;S.car=st.car;S.nom=st.nom||null;render()});
history.replaceState({v:0},"");
function scrHTML(){
const e=E.find(x=>x.id===S.car);if(!e)return "";
const bar=`<div class="bar"><button class="bk" data-a="bk">‹ Nazad</button><h2>${S.v===2?NOMN[S.nom]:e[0]}</h2></div>`;
if(S.v===1){const ns=noms(e);
return bar+`<p class="sub">${e[1]}, ${e[2]}</p>`+(ns.length?ns.map(([n,l])=>`<article class="c"><button class="h" data-a="nm" data-n="${n}"><span class="av"><img src="${bp(e,n,l[0].f)}" alt=""></span><span class="hd"><b>${NOMN[n]}</b><i>${l.length} ${l.length===1?"slika":"slike"}</i></span><span class="bd">›</span></button></article>`).join(""):`<p class="sub">Za ovog cara još nema slika po nominacijama.</p>`)+detail(e,e.id)}
const l=((typeof BAZA!=="undefined"&&BAZA[e[1]])||{})[S.nom]||[];
return bar+`<p class="sub">${e[0]}, ${e[1]}</p><div class="gal">`+l.map(x=>{const u=bp(e,S.nom,x.f);return `<figure><img src="${u}" loading="lazy" data-a="zi" data-src="${u}" alt="${esc(e[0])}, ${NOMN[S.nom]}"><figcaption>${esc(x.a)} · ${esc(x.l)} · <a href="${esc(x.u)}" target="_blank" rel="noopener">Wikimedia Commons</a></figcaption></figure>`}).join("")+`</div><p class="sub" style="margin-top:12px">Dodirni sliku za uvećanje.</p>`}
render();
$("crl").innerHTML=Object.keys(IMG).map(k=>IMG[k].map(x=>`<p><b>${k}</b>: ${x[1]} · <a href="${x[2]}" target="_blank" rel="noopener">Wikimedia Commons</a></p>`).join("")).join("")+"<p>Mali okrugli prikazi careva dolaze iz tabele nepoznatog izvora.</p><p>Slike novčića po nominacijama dolaze sa Wikimedia Commons. Autor i licenca stoje ispod svake slike.</p>";
if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})}
</script></body></html>
