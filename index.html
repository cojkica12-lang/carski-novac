function detail(e,i){const ph=S.ph[i]||[];
const pl=(PL[e[1]]||[]).map(n=>`<figure class="pl"><img src="${PLATES[n]}" data-a="zoom" data-n="${n}" alt="${t("plate")} ${n}"><figcaption>RIC V.1, ${t("plate").toLowerCase()} ${n}</figcaption></figure>`).join("");
const ty=(TY[e[1]]||[]).map(x=>`<li>${x[0]==="Double denarius"?"Antoninianus":x[0]}${x[1]?", "+x[1]:""} · RIC ${x[2]} · ${x[3]}</li>`).join("");
const stat=(IMG[e[1]]||[]).map(x=>`<figure><img src="${x[0]}" alt="${nm(e)}"><figcaption>${x[1]}</figcaption></figure>`).join("")+(CHART[e[1]]?`<figure><img src="${CHART[e[1]]}" alt="${nm(e)}"><figcaption>${t("chart")}</figcaption></figure>`:"");
const strip=stat+(S.mine?`<figure class="m"><img src="${S.mine}" alt="${t("mycoin")}"><figcaption>${t("mycoin")}</figcaption></figure>`:"")+ph.map((p,k)=>`<figure><img src="${p}" alt="${nm(e)}"><button class="x" data-a="del" data-i="${i}" data-k="${k}" aria-label="${t("delimg")}">×</button><figcaption>${nm(e)}</figcaption></figure>`).join("");
return `<div class="d"><p>${ds(e)}</p><p class="lg">${e[5]}</p>${strip?`<div class="st">${strip}</div>`:`<p>${t("noimg")}</p>`}${pl?`<p class="lg" style="margin-top:12px">${t("tables")}</p><div class="st">${pl}</div><p style="font-size:13px;color:var(--mu)">${t("tapplate")}</p>`:""}${ty?`<p class="lg" style="margin-top:12px">${t("rev")}</p><ul class="ty">${ty}</ul><p style="font-size:12px;color:var(--mu)">${t("ocr")}</p>`:""}<div class="row"><label class="btn">${t("addimg")}<input type="file" accept="image/*" multiple data-i="${i}"></label><a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(e[1]+" roman coin")}">${t("gimg")}</a><a class="btn g" target="_blank" rel="noopener" href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(e[1]+" coin")}&ns6=1">Wikimedia</a></div></div>`}
function render(){
$("home").hidden=S.v!==0;$("scr").hidden=S.v===0;
if(S.v!==0){$("scr").innerHTML=scrHTML();return}
$("res").innerHTML=resHTML();
$("mine").innerHTML=`<div class="th">${S.mine?`<img src="${S.mine}" alt="">`:t("img")}</div><div><b>${t("mycoin")}</b><p>${t("minehint")}</p><label class="btn">${S.mine?t("replace"):t("addimg")}<input type="file" accept="image/*" data-i="mine"></label></div>`;
$("f").innerHTML=[[t("all"),-1],...BLX[LANG].map((l,n)=>[l,n])].map(([l,n])=>`<button data-a="b" data-n="${n}" class="${S.b===n?"on":""}">${l}</button>`).join("");
const q=S.q.toLowerCase();
const L=E.map(e=>[e,e.id]).filter(([e])=>(S.b<0||e[3]===S.b)&&(!q||(e[0]+e[1]+e[5]+e[2]).toLowerCase().includes(q)));
$("cnt").textContent=L.length+" "+t("emps");
$("list").innerHTML=L.map(([e,i])=>{const ph=S.ph[i]||[];return `<article class="c"><button class="h" data-a="t" data-i="${i}"><span class="av">${(ph[0]||CHART[e[1]]||(IMG[e[1]]&&IMG[e[1]][0][0]))?`<img src="${ph[0]||CHART[e[1]]||IMG[e[1]][0][0]}" alt="">`:nm(e)[0]}</span><span class="hd"><b>${nm(e)}</b><i>${sub(e)}</i></span><span class="bd">${BLX[LANG][e[3]]}</span></button></article>`}).join("")||`<p class="sub">${t("nores")}</p>`}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
if(a==="zoom"){const z=$("zm"),im=z.querySelector("img");im.className="";im.src=PLATES[b.dataset.n];z.style.alignItems="";z.style.justifyContent="";z.style.display="flex";z.scrollTop=0;return}
if(a==="zi"){const z=$("zm"),im=z.querySelector("img");im.className="fit";im.src=b.dataset.src;z.style.alignItems="center";z.style.justifyContent="center";z.style.display="flex";return}
if(a==="build"){buildEmb();return}
if(a==="lg"){LANG=b.dataset.n;try{localStorage.setItem("lang",LANG)}catch(e){}applyLang();render();return}
if(a==="bk"){history.back();return}
if(a==="nm"){nav(2,S.car,b.dataset.n);return}
if(a==="nf"){S.nomf=b.dataset.n;rescore();return}
if(a==="zx"){$("zm").style.display="none";return}
if(a==="idf"){identify();return}
if(a==="go"){nav(1,+b.dataset.i);return}
if(a==="t"){nav(1,+b.dataset.i);return}
if(a==="b"){S.b=+b.dataset.n}
else if(a==="del"){S.ph[b.dataset.i].splice(+b.dataset.k,1);save()}
render()});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});
document.addEventListener("change",async ev=>{const inp=ev.target;if(inp.type!=="file")return;const id=inp.dataset.i;
for(const f of inp.files){const d=await shrink(f);if(id==="mine")S.mine=d;else(S.ph[id]=S.ph[id]||[]).push(d)}
save();render();if(id==="mine"&&S.mine){S.res=null;identify()}});

/* ===== Prepoznavanje cara po slici ===== */
const EN={};E.forEach(e=>EN[e[1]]=e);
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("net"));document.head.appendChild(s)})}
let MN=null;
async function getModel(){if(MN)return MN;
if(!window.tf)await loadJS("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
if(!window.mobilenet)await loadJS("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");
MN=await mobilenet.load({version:2,alpha:1.0});return MN}
function loadImg(src){return new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src})}
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("cn",1);r.onupgradeneeded=()=>r.result.createObjectStore("e");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction("e").objectStore("e").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction("e","readwrite");t.objectStore("e").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}catch(e){}}
function prep(img,ang){const N=224,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d",{willReadFrequently:true});
const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(w,h);
x.fillStyle="#808080";x.fillRect(0,0,N,N);x.translate(N/2,N/2);x.rotate((ang||0)*Math.PI/180);
x.drawImage(img,w/h>1.5?0:(w-s)/2,(h-s)/2,s,s,-N/2,-N/2,N,N);x.setTransform(1,0,0,1,0,0);
const d=x.getImageData(0,0,N,N),p=d.data,R=N/2,g=new Float32Array(N*N);let sum=0,n=0;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx;g[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];if((xx-R)**2+(y-R)**2<=R*R*.9){sum+=g[i];n++}}
const m=sum/n;let v=0;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){if((xx-R)**2+(y-R)**2<=R*R*.9){v+=(g[y*N+xx]-m)**2}}
const sd=Math.sqrt(v/n)||1;
for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx,o=((xx-R)**2+(y-R)**2<=R*R*.9)?Math.max(0,Math.min(255,128+(g[i]-m)/sd*45)):128;p[i*4]=p[i*4+1]=p[i*4+2]=o;p[i*4+3]=255}
x.putImageData(d,0,0);return c}
async function embed(m,img,ang){const t=m.infer(prep(img,ang),true);const v=Float32Array.from(await t.data());t.dispose();let n=0;for(let i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;for(let i=0;i<v.length;i++)v[i]/=n;return v}
function refList(){const r=[];Object.keys(EN).forEach(n=>{
if(typeof CHART!=="undefined"&&CHART[n])r.push({n,m:"",s:CHART[n]});
((typeof IMG!=="undefined"&&IMG[n])||[]).forEach(x=>r.push({n,m:"",s:x[0]}));
const b=(typeof BAZA!=="undefined"&&BAZA[n])||{};
Object.keys(b).forEach(m=>b[m].forEach(x=>r.push({n,m,s:"baza/"+n.replace(/ /g,"_")+"/"+m+"/"+x.f})))});return r}
function setBusy(t){S.busy=t;$("res").innerHTML=resHTML()}
let working=false;
async function identify(){
if(working||!S.mine)return;working=true;S.res=null;S.qv=null;
try{
setBusy(t("loadm"));
const m=await getModel();
const refs=refList();
const sig=sigOf(refs);
let db=await idbGet("emb");if(db&&db.sig!==sig)db=null;
if(!db){setBusy(t("loadpre"));db=await loadPre(refs,sig);if(db)await idbSet("emb",db)}
if(!db){
db={sig,d:[]};let k=0;
for(const r of refs){
setBusy(t("prep")+(++k)+"/"+refs.length+t("firstonly"));
const im=await loadImg(r.s);if(im){try{db.d.push({n:r.n,m:r.m,s:r.s,v:await embed(m,im,0)})}catch(e){}}
await new Promise(r=>setTimeout(r,0))}
await idbSet("emb",db)}
S.db=db;
setBusy(t("compare"));
const qi=await loadImg(S.mine);if(!qi)throw new Error("img");
S.qv=[];for(const a of [0,45,90,135,180,225,270,315]){S.qv.push(await embed(m,qi,a))}score();
}catch(e){toast(t("iderr"))}
S.busy=null;working=false;$("res").innerHTML=resHTML()}
function score(){const best={};
for(const r of S.db.d){if(S.nomf&&r.m!==S.nomf)continue;let d=-9;
for(const qv of S.qv){let t=0;for(let i=0;i<qv.length;i++)t+=qv[i]*r.v[i];if(t>d)d=t}
if(!(r.n in best)||d>best[r.n].s)best[r.n]={n:r.n,s:d,i:r.s}}
S.res=Object.values(best).sort((a,b)=>b.s-a.s).slice(0,5)}
function rescore(){if(S.qv&&S.db){score();$("res").innerHTML=resHTML()}}
const sigOf=refs=>"v3:"+refs.length+":"+refs.reduce((a,r)=>a+r.s.length,0);
async function loadPre(refs,sig){try{
const j=await(await fetch("emb.json",{cache:"no-cache"})).json();if(j.sig!==sig)return null;
const r2=await fetch("emb.bin",{cache:"no-cache"});if(!r2.ok)return null;
const b=new Int8Array(await r2.arrayBuffer()),D=j.dim;if(b.length!==j.idx.length*D)return null;
const d=[];for(let k=0;k<j.idx.length;k++){const r=refs[j.idx[k]],v=new Float32Array(D),sc=j.sc[k]/127;for(let i=0;i<D;i++)v[i]=b[k*D+i]*sc;d.push({n:r.n,m:r.m,s:r.s,v:v})}
return{sig:sig,d:d}}catch(e){return null}}
async function buildEmb(){try{
setBusy(t("loadm"));const m=await getModel(),refs=refList(),sig=sigOf(refs),idx=[],sc=[],rows=[];
for(let ri=0;ri<refs.length;ri++){setBusy("Build "+(ri+1)+"/"+refs.length);
const im=await loadImg(refs[ri].s);if(!im)continue;let v;try{v=await embed(m,im,0)}catch(e){continue}
let mx=0;for(let i=0;i<v.length;i++)mx=Math.max(mx,Math.abs(v[i]));mx=mx||1;
const q=new Int8Array(v.length);for(let i=0;i<v.length;i++)q[i]=Math.round(v[i]/mx*127);
idx.push(ri);sc.push(mx);rows.push(q);await new Promise(r=>setTimeout(r,0))}
const D=rows[0].length,bin=new Int8Array(rows.length*D);rows.forEach((q,i)=>bin.set(q,i*D));
const u1=URL.createObjectURL(new Blob([JSON.stringify({sig:sig,dim:D,idx:idx,sc:sc})],{type:"application/json"})),u2=URL.createObjectURL(new Blob([bin],{type:"application/octet-stream"}));
S.busy=null;$("res").innerHTML=`<div class="mine" style="display:block"><p>Done: ${idx.length}</p><a class="btn" download="emb.json" href="${u1}">emb.json</a> <a class="btn" download="emb.bin" href="${u2}">emb.bin</a></div>`
}catch(e){setBusy("Build failed: "+e.message)}}
function thumbUrl(e){const ph=S.ph[e.id]||[];if(ph[0])return ph[0];if(typeof CHART!=="undefined"&&CHART[e[1]])return CHART[e[1]];
if(typeof IMG!=="undefined"&&IMG[e[1]]&&IMG[e[1]][0])return IMG[e[1]][0][0];
const n=noms(e);return n.length?bp(e,n[0][0],n[0][1][0].f):""}
function resHTML(){
if(S.busy)return `<div class="mine"><p>${S.busy}</p></div>`;
if(!S.mine)return "";
if(!S.qv)return `<div class="mine"><div><b>${t("ident")}</b><button class="btn" data-a="idf">${t("identbtn")}</button></div></div>`;
const av=(e,r)=>{const u=(r&&r.i)||thumbUrl(e);return u?`<img src="${u}" alt="">`:e[0][0]};
const chips=`<p>${t("nomq")}</p><div class="f">`+[["",t("dk")]].concat(NORD.map(n=>[n,nomn(n)])).map(([n,l])=>`<button data-a="nf" data-n="${n}" class="${S.nomf===n?"on":""}">${l}</button>`).join("")+`</div>`;
const list=S.res&&S.res.length?S.res.map(r=>{const e=EN[r.n];return `<article class="c" style="margin:8px 0 0"><button class="h" data-a="go" data-i="${e.id}"><span class="av">${av(e,r)}</span><span class="hd"><b>${nm(e)}</b><i>${sub(e)}</i></span><span class="bd">${Math.round(r.s*100)}%</span></button></article>`}).join(""):`<p>${t("nonom")}</p>`;
return `<div class="mine" style="display:block"><b>${t("best")}</b><p>${t("besthint")}</p>${list}${chips}<button class="btn g" data-a="idf">${t("retry")}</button></div>`}
/* ===== Ekrani: car i nominacija ===== */
const NOMN={aureus:"Aureus",antoninijan:"Antoninijan",denarij:"Denarijus",sestercij:"Sestercijus",dupondije:"Dupondijus",as:"As",follis:"Follis",solidus:"Solidus",siliqua:"Siliqua",centenionalis:"Centenionalis",argenteus:"Argenteus",cistophorus:"Kistofor",quadrans:"Kvadrans",quinarius:"Kvinarijus"};
const NORD=Object.keys(NOMN);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bp=(e,nom,f)=>"baza/"+e[1].replace(/ /g,"_")+"/"+nom+"/"+f;
function noms(e){const b=(typeof BAZA!=="undefined"&&BAZA[e[1]])||{};return NORD.filter(n=>b[n]&&b[n].length).map(n=>[n,b[n]])}
function nav(v,car,nom){S.v=v;S.car=car;S.nom=nom||null;history.pushState({v:v,car:car,nom:S.nom},"");render();window.scrollTo(0,0)}
window.addEventListener("popstate",ev=>{const st=ev.state||{v:0};S.v=st.v||0;S.car=st.car;S.nom=st.nom||null;render()});
history.replaceState({v:0},"");
function scrHTML(){
const e=E.find(x=>x.id===S.car);if(!e)return "";
const bar=`<div class="bar"><button class="bk" data-a="bk">${t("back")}</button><h2>${S.v===2?nomn(S.nom):nm(e)}</h2></div>`;
if(S.v===1){const ns=noms(e);
return bar+`<p class="sub">${sub(e)}</p>`+(ns.length?ns.map(([n,l])=>`<article class="c"><button class="h" data-a="nm" data-n="${n}"><span class="av"><img src="${bp(e,n,l[0].f)}" alt=""></span><span class="hd"><b>${nomn(n)}</b><i>${l.length} ${cntw(l.length)}</i></span><span class="bd">›</span></button></article>`).join(""):`<p class="sub">${t("nonomimg")}</p>`)+detail(e,e.id)}
const l=((typeof BAZA!=="undefined"&&BAZA[e[1]])||{})[S.nom]||[];
return bar+`<p class="sub">${nm(e)}, ${e[1]}</p><div class="gal">`+l.map(x=>{const u=bp(e,S.nom,x.f);return `<figure><img src="${u}" loading="lazy" data-a="zi" data-src="${u}" alt="${esc(nm(e))}, ${nomn(S.nom)}"><figcaption>${x.u?`${esc(x.a)} · ${esc(x.l)} · <a href="${esc(x.u)}" target="_blank" rel="noopener">${x.u.includes("wikimedia")?"Wikimedia Commons":"OCRE"}</a>`:t("test")}</figcaption></figure>`}).join("")+`</div><p class="sub" style="margin-top:12px">${t("tapzoom")}</p>`}
render();
applyLang();
if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})}
</script></body></html>
